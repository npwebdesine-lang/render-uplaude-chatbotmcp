<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>AI Workspace</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  </head>
  <body>
    <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>

    <div class="app-container">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="logo-area">
            <div class="logo"></div>
            <h2>AI Workspace</h2>
          </div>
          <button id="closeSidebarBtn" class="close-sidebar-btn hidden">
            ✕
          </button>
        </div>

        <div class="sidebar-section">
          <div class="section-title">הצ'אטים שלי</div>
          <button id="newChatBtn" class="action-btn primary-btn">
            + צ'אט חדש
          </button>
          <div id="chatList" class="scrollable-list"></div>
        </div>

        <div class="sidebar-section">
          <div class="section-title row">
            <span>הכלים שלי (MCP)</span>
            <button id="openMcpModalBtn" class="icon-btn" title="הוסף כלי">
              ➕
            </button>
          </div>
          <div id="mcpList" class="scrollable-list"></div>
        </div>

        <div class="sidebar-section">
          <div class="section-title row">
            <span>MCP מקומי 💻</span>
            <button id="openLocalMcpModalBtn" class="icon-btn" title="הוסף MCP מקומי">
              ➕
            </button>
          </div>
          <div id="localMcpList" class="scrollable-list"></div>
        </div>
      </aside>

      <main class="main-chat">
        <div class="chat-header">
          <h3 id="currentChatTitle">צ'אט חדש</h3>
          <button id="deleteChatBtn" class="danger-btn">מחק צ'אט</button>
        </div>

        <div id="chat" class="chat-area"></div>

        <div class="input-area">
          <form id="form" class="chat-form">
            <textarea
              id="input"
              placeholder="כתוב הודעה כאן... (Shift + Enter לשורה חדשה)"
              autocomplete="off"
              rows="1"
            ></textarea>
            <button id="send" type="submit">שלח</button>
          </form>
          <div class="footer-hint">
            המודל מזהה ויפעיל אוטומטית את הכלים שחיברת.
          </div>
        </div>
      </main>
    </div>

    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <h3>הוספת כלי חדש (MCP)</h3>
          <button id="closeModalBtn" class="icon-btn">✕</button>
        </div>

        <!-- Tab toggle -->
        <div class="mcp-type-tabs">
          <button id="tabHttp" class="tab-btn active">🌐 HTTP / SSE</button>
          <button id="tabStdio" class="tab-btn">💻 STDIO (מקומי)</button>
        </div>

        <!-- שדות משותפים -->
        <div class="field">
          <label>מזהה כלי (אנגלית, ללא רווחים)</label>
          <input id="httpId" placeholder="e.g. filesystem" />
        </div>
        <div class="field">
          <label>שם לתצוגה</label>
          <input id="httpLabel" placeholder="My Filesystem" />
        </div>

        <!-- HTTP fields -->
        <div id="httpFields">
          <div class="field">
            <label>כתובת השרת (URL)</label>
            <input id="httpUrl" placeholder="https://my-server.onrender.com" />
          </div>
        </div>

        <!-- STDIO fields -->
        <div id="stdioFields" class="hidden">
          <div class="field">
            <label>פקודה</label>
            <input id="stdioCommand" placeholder="npx @modelcontextprotocol/server-filesystem" />
          </div>
          <div class="field">
            <label>ארגומנטים (מופרדים ברווחים)</label>
            <input id="stdioArgs" placeholder="./docs /tmp" />
          </div>
        </div>

        <div class="actions">
          <button id="addHttpBtn" class="primary-btn">הוסף כלי</button>
          <button id="cancelBtn1" class="ghost-btn">ביטול</button>
        </div>
        <div id="httpStatus" class="status"></div>
      </div>
    </div>

    <!-- Modal: MCP מקומי -->
    <div id="localMcpModal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <h3>הוספת MCP מקומי 💻</h3>
          <button id="closeLocalModalBtn" class="icon-btn">✕</button>
        </div>
        <div class="field">
          <label>מזהה כלי (אנגלית, ללא רווחים)</label>
          <input id="localId" placeholder="my-python-server" />
        </div>
        <div class="field">
          <label>שם לתצוגה</label>
          <input id="localLabel" placeholder="Python Server" />
        </div>
        <div class="field">
          <label>פקודה להרצה עם bridge.js</label>
          <input id="localCommand" placeholder="python my_server.py" />
        </div>
        <div class="actions">
          <button id="addLocalMcpBtn" class="primary-btn">שמור</button>
          <button id="cancelLocalBtn" class="ghost-btn">ביטול</button>
        </div>
        <div id="localMcpStatus" class="status"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
